name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: j178/prek-action@v3.0.0
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm
          - os: ubuntu-latest
            static: true
          - os: ubuntu-24.04-arm
            static: true
          - os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: .github/scripts/fetch-submodules.sh
      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.15.2
      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y autoconf automake
      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install autoconf automake
      - run: ./build.sh ${{ matrix.static && '--static' || '' }}
      - if: ${{ !matrix.static }}
        run: ./tests/run_smoke_tests.sh
      - name: Test on CentOS 7, Rocky Linux 8, and Debian
        if: ${{ runner.os == 'Linux' && !matrix.static }}
        run: |
          for image in centos:7 rockylinux:8 debian:stable-slim; do
            docker run --rm -v "$PWD":/work -w /work "$image" sh -c '
              ./tests/run_smoke_tests.sh'
          done
      - name: Test in Alpine (musl)
        if: ${{ matrix.static }}
        run: |
          docker run --rm -v "$PWD":/work -w /work alpine:3.22 sh -c '
            apk add --no-cache bash &&
            ./tests/run_smoke_tests.sh --static'
